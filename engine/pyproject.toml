[project]
name = "line-sticker-pipeline"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "opencv-python>=4.10",
  "numpy>=2.0",
  "Pillow>=11.0",
]

[project.optional-dependencies]
desktop = ["PySide6>=6.8"]
ai = ["onnxruntime>=1.20"]
ocr = ["pytesseract>=0.3.13", "paddleocr>=3.0"]
test = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[project.scripts]
line-sticker-pipeline = "line_sticker_pipeline.cli:main"
line-sticker-desktop = "line_sticker_pipeline.ui:main"
