name: MT Sticker Gate A1 document verification
on:
  push:
    paths:
      - 'sets/SET-KHE-NOI-FIRST-HOME-001/**'
      - 'tools/gem_a/**'
      - '.github/workflows/mt-sticker-a1.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify Gate A1 and generate SHA-256 Manifest
        run: python tools/gem_a/finalize_khe_a1.py
      - name: Publish verified report and updated manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sets/SET-KHE-NOI-FIRST-HOME-001/PACKAGE_MANIFEST.json sets/SET-KHE-NOI-FIRST-HOME-001/project.json sets/SET-KHE-NOI-FIRST-HOME-001/handoff.json gate-reports/SET-KHE-NOI-FIRST-HOME-001/A1_LATEST.json
          if ! git diff --cached --quiet; then git commit -m "qa(khe-home): publish executed Gate A1 validator result and document hashes"; git push; fi
